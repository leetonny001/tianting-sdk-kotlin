# 天听 Kotlin SDK 的 CI：错误码生成文件与协议副本一致、单元测试（假传输层 + 假时钟 + 真 SQLite）、Android 适配层（Robolectric）。
# 集成测试需要 tianting-server 源码（私有仓库）：配置了只读部署密钥 secret TIANTING_SERVER_DEPLOY_KEY 才跑，没配置时跳过（见 README「集成测试」）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: ErrorCodes.gen.kt 与 protocol/errors.json 一致 + 单元测试
        run: ./gradlew :sdk-core:check :sdk-sqlite-jdbc:assemble
      - name: Android 适配层（编译 + Robolectric）
        run: ./gradlew :sdk-android:testDebugUnitTest

  integration:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.TIANTING_SERVER_DEPLOY_KEY != '' }}
    steps:
      - name: 未配置只读部署密钥，跳过集成测试
        if: env.HAS_KEY != 'true'
        run: echo "::notice::未配置 TIANTING_SERVER_DEPLOY_KEY，跳过集成测试"
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - name: 检出 tianting-server（只读部署密钥）
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: leetonny001/tianting-server
          ssh-key: ${{ secrets.TIANTING_SERVER_DEPLOY_KEY }}
          path: tianting-server
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-go@v5
        if: env.HAS_KEY == 'true'
        with:
          go-version-file: tianting-server/server/go.mod
          cache-dependency-path: tianting-server/server/go.sum
      - name: 集成测试（真实 im-server）
        if: env.HAS_KEY == 'true'
        run: ./gradlew :sdk-core:integrationTest
        env:
          TIANTING_SERVER_DIR: ${{ github.workspace }}/tianting-server/server
